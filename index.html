<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1b5e20">
  <title>SiteGuard</title>
  <meta name="description" content="SiteGuard: construction site safety. Report hazards with a photo and location, follow them up, and see the site on a map.">
  <meta property="og:title" content="SiteGuard">
  <meta property="og:description" content="Daily safety and coordination for construction sites: morning meeting, permits, SPAs, observations, deliveries and inspections.">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="SiteGuard">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="preload" href="fonts/barlow-400.woff" as="font" type="font/woff" crossorigin>
  <link rel="preload" href="fonts/barlow-sc-600.woff" as="font" type="font/woff" crossorigin>
  <link rel="stylesheet" href="lib/leaflet/leaflet.css">
  <link rel="stylesheet" href="css/app.css">
  <script src="lib/leaflet/leaflet.js" defer></script>
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <!-- hazard-tape fill for exclusion zones on the maps -->
  <svg class="defs" width="0" height="0" aria-hidden="true" focusable="false">
    <defs>
      <pattern id="hazard" patternUnits="userSpaceOnUse" width="16" height="16" patternTransform="rotate(45)">
        <rect width="16" height="16" fill="#f5b800"/><rect width="8" height="16" fill="#111111"/>
      </pattern>
    </defs>
  </svg>

  <div id="login" class="login" hidden></div>

  <div id="app" class="shell" hidden>
    <header class="appbar">
      <div class="appbar-in">
        <button type="button" id="backBtn" class="hd-btn" data-act="goBack" aria-label="Back"></button>
        <a id="appBrand" class="app-brand" href="#/home"><span id="brandLogo"></span><span>SiteGuard</span></a>
        <h1 id="pageTitle"></h1>
        <div id="pageActions" class="hd-actions"></div>
        <button type="button" id="bellBtn" class="hd-btn bell" data-act="bell" aria-label="Notifications">
          <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M10.268 21a2 2 0 0 0 3.464 0"/><path d="M3.262 15.326A1 1 0 0 0 4 17h16a1 1 0 0 0 .74-1.673C19.41 13.956 18 12.499 18 8A6 6 0 0 0 6 8c0 4.499-1.411 5.956-2.738 7.326"/></svg>
          <b id="bellCount" hidden></b></button>
        <div id="notePop" class="pop notes-pop" hidden></div>
      </div>
    </header>
    <div id="subbar" class="subbar" hidden><p id="pageSub"></p><div id="subActions" class="page-actions"></div></div>
    <main id="view" class="view" tabindex="-1"></main>
    <nav id="tabbar" class="tabbar" aria-label="Quick menu"></nav>
  </div>

  <dialog id="dlg"></dialog>
  <div id="toasts" class="toasts" aria-live="polite"></div>
  <div id="tip" class="tip" role="tooltip" hidden></div>
  <noscript><p class="noscript">SiteGuard needs JavaScript. Switch it on in the browser settings and reload.</p></noscript>
</body>
</html>
